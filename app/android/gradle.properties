org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# `android.enableR8` is removed in AGP 8 — R8 is now the only shrinker, always on.
# `android.bundle.enableUncompressedNativeLibs` removed in AGP 8.1 — default is now true.
android.useAndroidX=true
android.enableJetifier=true
# AGP 8.7 emits "compileSdk newer than AGP supports" warnings against API 36.
# Suppress — the combination is stable in practice and ships in the official
# Flutter 3.41 Android template.
android.suppressUnsupportedCompileSdk=36
# Faster local builds.
org.gradle.parallel=true
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
