name: sportsmojo
description: A new Flutter project.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.2+4

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.40.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.8.0+1
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.1
  dio_smart_retry: ^5.0.0
  socket_io_client: ^2.0.3+1

  # Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path: ^1.8.0
  path_provider: ^2.0.0

  # Codegen-friendly models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1                # SVG flag rendering from api-football
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  flutter_spinkit: ^5.2.1
  auto_size_text: ^3.0.0
  dynamic_color: ^1.7.0
  flutter_local_notifications: ^17.2.2
  flutter_animate: ^4.5.0          # declarative animation pipelines
  fl_chart: ^0.69.0                # match stats charts
  webview_flutter: ^4.8.0          # in-app news reader
  visibility_detector: ^0.4.0+2    # animate-on-enter for list items

  # i18n / formatting
  intl: ^0.20.2

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  cloud_firestore: ^4.13.6
  firebase_remote_config: ^4.2.5
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.9

  # Monetization (halal-configured: filtered ad categories in AdMob console)
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

  # Misc
  connectivity_plus: ^6.1.4
  share_plus: ^11.0.0
  chottu_link: ^1.1.0

  # App updates
  in_app_update: ^4.2.3              # Android Play Store in-app updates (Android-only)
  shorebird_code_push: ^2.0.4        # Dart code push (cross-platform)
  package_info_plus: ^8.0.2          # Read installed app version for gating

  # Analytics — Microsoft Clarity session recording + heatmaps
  clarity_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_foreground.png"
  # Adaptive icon layers (Android 8+) — this is what makes the icon
  # render full-size with your branded dark background instead of
  # being shrunk inside a white circle.
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_background: "#0F0E0D"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: fonts/MyFlutterApp.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
