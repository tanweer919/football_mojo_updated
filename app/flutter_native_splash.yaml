# Run after editing:
#   fvm dart run flutter_native_splash:create
flutter_native_splash:
  color:      "#0F0E0D"           # dark background matching PITCH brand
  color_dark: "#0F0E0D"
  image:      assets/images/splash_screen.png
  image_dark: assets/images/splash_screen.png
  android: true
  ios: true
  web: false

  # Android 12+ renders the icon inside a CIRCULAR mask (the visible area
  # is roughly the inner 2/3 ≈ 66.7% of the supplied image). No wordmark
  # here (text would get clipped by the circle) — just the white football
  # mark, scaled to ~64% on the brand background so it's as large as
  # possible while sitting fully inside the safe circle, uncut.
  android_12:
    color:      "#0F0E0D"
    color_dark: "#0F0E0D"
    image:      assets/images/splash_icon_a12.png
    image_dark: assets/images/splash_icon_a12.png
    icon_background_color:      "#0F0E0D"
    icon_background_color_dark: "#0F0E0D"

  fullscreen: false               # respect status/nav bar
