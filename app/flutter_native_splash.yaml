# Run after editing:
#   fvm dart run flutter_native_splash:create
flutter_native_splash:
  color:      "#0F0E0D"           # dark background matching PITCH brand
  color_dark: "#0F0E0D"
  image:      assets/images/splash_screen.png
  image_dark: assets/images/splash_screen.png
  android: true
  ios: true
  web: false

  # Android 12+ renders the icon inside a CIRCULAR mask (288dp circle,
  # 240dp safe zone). Using the full splash_screen.png here clips the
  # text and edges. Use a compact icon-only image instead — the ball +
  # "FM" mark with generous padding fits cleanly inside the circle.
  android_12:
    color:      "#0F0E0D"
    color_dark: "#0F0E0D"
    image:      assets/images/splash_icon.png
    image_dark: assets/images/splash_icon.png
    icon_background_color:      "#0F0E0D"
    icon_background_color_dark: "#0F0E0D"

  fullscreen: false               # respect status/nav bar
