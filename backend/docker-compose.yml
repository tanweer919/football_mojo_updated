# Local development. Includes postgres + redis as services.
# Production (Dokploy) uses backend/docker-compose.prod.yml which assumes
# Dokploy-managed Postgres + Redis.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: footballmojo
      POSTGRES_PASSWORD: footballmojo
      POSTGRES_DB: footballmojo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Idempotent grants — runs ONCE per fresh volume. Avoids the P1010
      # "denied access on public" problem we hit on Postgres 15+.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballmojo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration. Same pattern as prod, so dev and prod behave identically.
  migrate:
    build:
      context: .
      target: runtime
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    # Default CMD from the Dockerfile starts the server — no need to override.

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
