# Production Compose for Dokploy.
# - Postgres and Redis are NOT defined here — they live in Dokploy's managed
#   "Database" feature. Inject their connection URLs as env vars in the Dokploy
#   Application → Environment tab.
# - The `migrate` service runs once per deploy and gates api/worker so a failed
#   migration fails the deploy loudly rather than starting a half-broken app.
# - Resource limits sized for a single 28 GB Dokploy VM running other services
#   alongside. Tighten/loosen per host.
#
# Dokploy usage:
#   1. Application → Source → point at this repo
#   2. Compose file: backend/docker-compose.prod.yml
#   3. Environment: paste all vars from .env.example (with real values)
#   4. Deploy

services:
  # ── One-shot migration step ───────────────────────────────────────────────
  # Runs before api/worker, exits 0 on success. Dokploy will not promote the
  # deploy if this exits non-zero.
  migrate:
    build:
      context: .
      target: runtime
      args:
        BUILD_REF: ${BUILD_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: "no"
    env_file: .env
    # `migrate deploy` only applies committed migrations; never generates.
    # Safe under concurrent calls — Prisma takes an advisory lock.
    command: ["npx", "prisma", "migrate", "deploy"]
    logging: &json-rolling
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── HTTP + WebSocket API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
      args:
        BUILD_REF: ${BUILD_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Healthcheck is also defined in the Dockerfile, but explicit here so
    # Dokploy's Traefik integration picks it up for routing decisions.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *json-rolling

  # ── BullMQ worker: scoring pipeline, FCM dispatcher, pricing cron ─────────
  worker:
    build:
      context: .
      target: runtime
      args:
        BUILD_REF: ${BUILD_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_MODE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Worker has no HTTP — check the Node process is alive instead.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node dist/main.js"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    logging: *json-rolling
